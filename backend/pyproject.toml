[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-desktop-agent-runtime"
version = "0.2.1"
description = "Local-first FastAPI runtime for Personal Assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "psutil>=6.0,<7.0",
  "pyperclip>=1.9,<2.0",
  "pillow>=10.4,<12.0",
  "keyring>=25.3,<26.0",
  "lancedb>=0.13,<1.0",
  "pyarrow>=17,<20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.6,<1.0",
  "pyinstaller>=6.10,<7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["app*"]
