[package]
name = "sovereign-desktop-agent"
version = "0.1.0"
description = "Local-first desktop AI agent"
authors = ["Sovereign Desktop Agent contributors"]
edition = "2021"

[[bin]]
name = "sovereign-desktop-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
