[package]
name = "sovereign-desktop-agent"
version = "0.2.1"
description = "Local-first Personal Assistant for Windows"
authors = ["Personal Assistant contributors"]
edition = "2021"

[[bin]]
name = "sovereign-desktop-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
